# ---------------------------------------------------------------
# MySQL connection settings.
# Credentials are intentionally not stored here. Set SEEKORA_DB_USER and
# SEEKORA_DB_PASSWORD in the environment before starting the application.
# ---------------------------------------------------------------
db.url=jdbc:mysql://localhost:3306/seekora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# HikariCP pool
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeoutMs=10000
